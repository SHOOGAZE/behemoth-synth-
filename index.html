<style>
/* Layout: one-screen instrument. Header, source strip, scrolling module view, bottom tab bar in thumb reach. */
/* BRAUN: matte black, one colour - red - in shades. Indicators, shapes, modulation all live in the red family. */
:root { --bg: #0a0a0a; --panel: #111; --raised: #171717; --line: #262626; --fg: #dcd8d1; --mute: #8c8883; --dim: #57544f; --accent: #e6e6e6; --accent-glow: rgba(230, 230, 230, .45); --accent-ink: #0a0a0a; --accent-fg: #f5f5f5; /* overwritten at runtime by applyTheme() */ --ink: #000; --c-lfo: #d6d6d6; --c-env: #a8a8a8; --c-macro: #808080; --c-touch: #616161; --c-key: #dcd8d1; --scr-mute: #8c8883; --scr-panel: #070707; --f-display: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", system-ui, sans-serif; --f-body: var(--f-display); --f-mono: var(--f-display); color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }   /* follows the browser bars on phones */
body { margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 14px; padding-block: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 1600px; margin: 0 auto; }
header#top { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; flex: none; }

#presetBtn { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; text-align: left; display: flex; align-items: center; gap: 6px; cursor: pointer; }
#presetBtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#presetBtn i { font-style: normal; font-size: 11px; margin-left: auto; }
#scope { width: 84px; height: 34px; background: var(--panel); border-radius: 8px; border: 1px solid var(--line); flex: none; }
.meter { width: 8px; height: 34px; background: var(--panel); border-radius: 4px; border: 1px solid var(--line); position: relative; overflow: hidden; flex: none; }
.meter b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
#voices { font-family: var(--f-mono); font-size: 11px; color: var(--mute); width: 30px; text-align: center; flex: none; }
.pill { background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: .04em; }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

#srcbar { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; touch-action: pan-x; }
#srcbar::-webkit-scrollbar { display: none; }
.cap { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 11px; font-size: 11px; font-weight: 700; letter-spacing: .06em; touch-action: none; cursor: grab; font-family: var(--f-mono); }
.cap::before { content: ""; width: 9px; height: 9px; background: var(--sc); border-radius: var(--sh, 50%); }

.cap .n { color: var(--mute); font-weight: 500; }
.cap.sel .n { color: #0b0d10aa; }
.s-lfo { --sc: var(--c-lfo); }
.s-env { --sc: var(--c-env); --sh: 2px; }
.s-macro { --sc: var(--c-macro); --sh: 2px; }
.s-touch { --sc: var(--c-touch); --sh: 1px; }
.s-key { --sc: var(--c-key); --sh: 1px; }
#hint { flex: none; min-height: 18px; font-size: 11px; color: var(--mute); padding: 0 2px 4px; font-family: var(--f-mono); }
#hint b { color: var(--sc, var(--accent)); }

#views { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
#views::-webkit-scrollbar { display: none; }
.view { display: none; flex-direction: column; }
.view.on { display: flex; }
@media (min-width: 700px) { .view.on { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; gap: 16px; } .view .wide { grid-column: 1 / -1; } }
.card { container-type: inline-size; min-width: 0; }
.card h3 { font-size: 11px; font-weight: 700; gap: 8px; }
.card h3 .sp { flex: 1; }
.card h3 button.mini { background: var(--raised); border: 1px solid var(--line); font-size: 11px; letter-spacing: .04em; text-transform: none; font-weight: 600; cursor: pointer; }
.card h3 button.mini.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 4px 2px; justify-content: space-between; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; touch-action: pan-x; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--f-mono); letter-spacing: .02em; min-height: 36px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.knob { --kw: clamp(58px, 19cqw, 84px); width: var(--kw); display: flex; flex-direction: column; align-items: center; touch-action: none; cursor: ns-resize; }
.knob svg { width: calc(var(--kw) - 6px); height: calc(var(--kw) - 6px); overflow: visible; }
.knob .trk { fill: none; }
.knob .val { fill: none; stroke: var(--kc, var(--accent)); }
.knob .mod { fill: none; stroke-width: 3; opacity: .95; }

.knob .lbl { text-transform: uppercase; margin-top: -2px; text-align: center; white-space: nowrap; }
.knob .vv { font-family: var(--f-mono); font-size: 11px; min-height: 15px; }
.knob.big { width: 92px; }
.knob.big svg { width: 88px; height: 88px; }
.knob.big .lbl { font-size: 12px; }
.knob.big .vv { font-size: 13px; }

.knob.armed .trk { stroke: color-mix(in srgb, var(--arm) 55%, var(--line)); }
.knob.drop svg { transform: scale(1.12); filter: drop-shadow(0 0 8px var(--arm)); }
.knob.drop .cap { stroke: var(--arm); stroke-width: 2; }

canvas.vis { width: 100%; display: block; border-radius: 10px; background: #060607; touch-action: none; }
.tabhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tabhead .tn { flex: 1; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.tabhead .tn i { font-style: normal; font-size: 11px; font-family: var(--f-mono); align-self: center; }
.sw { width: 44px; height: 28px; position: relative; cursor: pointer; flex: none; }
.sw::before { content: ""; position: absolute; inset: -9px -4px; }   /* bigger touch area than the 44x28 look */
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; }

.sw.on::after { transform: translateX(16px); }

/* routes */
.route { display: grid; grid-template-columns: 10px 1fr 110px 34px; gap: 8px; align-items: center; padding: 8px 0; }
.route:first-of-type { border-top: 0; }
.route .dot { width: 10px; height: 10px; background: var(--sc); border-radius: var(--sh, 50%); }
.route .nm { font-size: 12px; min-width: 0; }
.route .nm b { color: var(--sc); font-family: var(--f-mono); font-weight: 600; }
.route .amt { font-family: var(--f-mono); font-size: 11px; color: var(--mute); }
.route button { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; height: 34px; cursor: pointer; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--sc, var(--accent)); margin-top: -9px; border: 0; }
input[type=range]::-moz-range-track { height: 4px; background: var(--line); border-radius: 2px; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--sc, var(--accent)); border: 0; }
.empty { color: var(--dim); font-size: 12px; padding: 6px 2px 8px; line-height: 1.5; }

/* play */
#surface, #surfaceQ , #surfaceS, #surfaceD { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); height: 210px; border-radius: 14px; overflow: hidden; background: #060607; border: 1px solid var(--line); touch-action: none; }
#surface .cell, #surfaceQ .cell, #surfaceS .cell, #surfaceD .cell { border-right: 1px solid #141415; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--dim); transition: background .08s; }
#surface .cell.root, #surfaceQ .cell.root, #surfaceS .cell.root, #surfaceD .cell.root { background: #0e0e0f; color: var(--mute); }
#surface .cell.on, #surfaceQ .cell.on, #surfaceS .cell.on, #surfaceD .cell.on { color: var(--fg); }
#surface .dotp, #surfaceQ .dotp, #surfaceS .dotp, #surfaceD .dotp { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid var(--c-touch); background: color-mix(in srgb, var(--c-touch) 28%, transparent); pointer-events: none; display: none; }
.kbd { position: relative; height: 96px; display: flex; touch-action: none; overflow: hidden; }
.kbd .wk { flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; font-size: 10px; font-family: var(--f-mono); }

.kbd .bk { position: absolute; top: 0; width: 8%; height: 58%; border-radius: 0 0 4px 4px; transform: translateX(-50%); z-index: 2; }

.ctlrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ctlrow .lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); width: 52px; font-weight: 700; flex: none; }
.stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
.stepper button { width: 40px; height: 36px; background: transparent; border: 0; cursor: pointer; font-size: 16px; }
.stepper span { min-width: 64px; text-align: center; font-family: var(--f-mono); font-size: 12px; }

nav#tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); }
nav#tabs button { background: transparent; border: 0; padding: 10px 0 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav#tabs button::before { content: ""; width: 22px; background: transparent; }

/* sheets */
.sheetbg { position: fixed; inset: 0; z-index: 130; display: none; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.sheetbg.on { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 131; max-height: 92%; display: none; flex-direction: column; padding: 8px max(14px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); max-width: 820px; margin: 0 auto; }
.sheet.on { display: flex; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; margin: 2px auto 10px; flex: none; }
.sheet .sbody { overflow-y: auto; min-height: 0; scrollbar-width: none; }
.sheet h2 { margin: 0 0 10px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.btn { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--f-mono); }

.btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.pi { display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; }
.pi.cur { border-color: var(--accent); }
.pi small { font-family: var(--f-mono); font-size: 10px; margin-left: auto; }
.pi .del { margin-left: 8px; color: var(--c-macro); font-size: 16px; line-height: 1; padding: 0 4px; }
input[type=text], textarea { padding: 10px; font-family: var(--f-mono); font-size: 13px; width: 100%; user-select: text; -webkit-user-select: text; }
textarea { min-height: 90px; resize: vertical; }

/* QPM overlay */
#qpm { position: fixed; inset: 0; z-index: 110; display: none; flex-direction: column; gap: 10px; padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
#qpm.on { display: flex; }
#qpm .qtop { display: flex; align-items: center; gap: 10px; }
#qpm .qtop .t { flex: 1; }
#qpm .qmid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
@media (max-aspect-ratio: 1/1) { #qpm .qmid { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } }
#qpm .qcol { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; }
#qpm #surfaceQ , #surfaceS { height: 100%; min-height: 160px; }
.snap { width: 100%; min-height: 64px; flex: 1 1 40%; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-weight: 700; letter-spacing: .08em; font-size: 13px; cursor: pointer; touch-action: none; }
.snap.on { background: var(--accent); color: var(--accent-ink); }
.snap small { display: block; font-weight: 500; font-size: 10px; opacity: .7; font-family: var(--f-mono); letter-spacing: 0; }
.hold { position: relative; overflow: hidden; }
.hold i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: color-mix(in srgb, var(--c-macro) 50%, transparent); }

#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 9px 14px; font-size: 12px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; text-align: center; }
#toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* performance dock: always-on HOLD, octave, arp, panic and a gliss keyboard */
#dock { flex: none; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
#dock .drow { display: flex; align-items: center; gap: 6px; }
#dock .pill { padding: 0 13px; height: 38px; display: inline-flex; align-items: center; justify-content: center; }
#dock .stepper button { width: 34px; height: 38px; }
#dock .stepper span { min-width: 50px; }
#dock .kbd { flex: none; }
#dock .kbd .wk { font-size: 9px; padding-bottom: 3px; }
#dock.min .kbd { display: none; }
.pill.on, .mini.on, .snap.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }

/* ================= header controls, wheels, settings  ================= */
.pgroup { display: flex; flex: 1; min-width: 0; gap: 4px; }
.pnav { width: 34px; flex: none; font-size: 22px; line-height: 1; cursor: pointer; background: var(--raised); border: 1px solid var(--line); border-radius: 3px; padding: 0 0 3px; }
.hbtn { height: 38px; padding: 0 11px; font: 700 11px var(--f-mono); letter-spacing: .1em; cursor: pointer; background: var(--raised); border: 1px solid var(--line); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.hbtn.ico { width: 38px; padding: 0; }
@media (max-width: 560px) { #scope, #voices, .meter { display: none; } header#top { flex-wrap: wrap; row-gap: 6px; } .logo { flex: 1; } .pgroup { order: 5; flex: 1 1 100%; } }
.setg { margin-bottom: 14px; }
.setg .chips { flex-wrap: wrap; overflow: visible; }
.lab2 { font: 700 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.wheel { display: none; position: relative; width: 46px; flex: none; touch-action: none; overflow: hidden; cursor: ns-resize; }
.wheel i { position: absolute; left: 3px; right: 3px; height: 22px; bottom: 0; }
.wheel b { position: absolute; top: 5px; left: 0; right: 0; text-align: center; font: 700 8px var(--f-mono); letter-spacing: .1em; pointer-events: none; }
.wheel.pitch::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #4a4a4f; pointer-events: none; }
@media (min-width: 640px) { :root[data-wheels="auto"] .wheel { display: block; } }
:root[data-wheels="on"] .wheel { display: block; }
#dock .dmain { display: flex; gap: 8px; align-items: stretch; }
#dock .dmain .kbd { flex: 1; min-width: 0; }
:root { --dkh: 58px; }
:root[data-kh="s"] { --dkh: 44px; }
:root[data-kh="m"] { --dkh: 60px; }
:root[data-kh="l"] { --dkh: 84px; }
#dock .kbd { height: var(--dkh); }
#dock.min .dmain { display: none; }

/* ================= tablets / big screens ================= */
@media (min-width: 700px) and (min-height: 541px) {
  :root { --dkh: 88px; } :root[data-kh="s"] { --dkh: 64px; } :root[data-kh="m"] { --dkh: 92px; } :root[data-kh="l"] { --dkh: 128px; }
  body { font-size: 15px; }
  .logo { font-size: 22px; } .hbtn { height: 44px; } .pnav { width: 44px; height: 44px; } #presetBtn { padding: 11px 14px; } #scope { width: 150px; height: 44px; } .meter { height: 44px; }
  #surface { height: clamp(220px, 36vh, 440px); } #v-play .kbd { height: 140px; }
  #dock .pill { height: 46px; padding: 0 18px; } #dock .stepper button { width: 44px; height: 46px; }
  .chip { min-height: 42px; padding: 10px 14px; } .knob.big { width: 110px; } .knob.big svg { width: 104px; height: 104px; }
  .wheel { width: 56px; }
}

/* ================= BRAUN skin: flat matte black, no gloss, no grain; red is the only colour ================= */
body { background: var(--bg); font-variant-numeric: tabular-nums; }
header#top { padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .2em; color: var(--fg); }
#views { padding: 4px 6px 20px 2px; }
.view { gap: 14px; }

.pnav, .hbtn, .pill, .btn, .chip, .stepper, .tabhead .tn, .pi, .snap, .route button, #presetBtn { background: #151515; color: var(--fg); border: 1px solid #272727; border-radius: 5px; box-shadow: none; }
.pill:active, .btn:active, .chip:active, .pnav:active, .hbtn:active, .snap:active, .pi:active, #presetBtn:active { background: #202020; transform: none; }
.hbtn, .pill, .chip, .btn { font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; }
.stepper button { color: var(--fg); }
.stepper { overflow: hidden; }
#presetBtn i { color: var(--accent-fg); }
.pill.on, .chip.on, .snap.on, .pi.cur, .card h3 button.mini.on, .mini.on { background: color-mix(in srgb, var(--accent) 13%, #0a0a0a); color: var(--accent-fg); border-color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pi small { color: var(--dim); }
.pi.cur small { color: var(--accent-fg); }

.cap { background: #131313; border: 1px solid color-mix(in srgb, var(--sc) 65%, #000); border-radius: 999px; box-shadow: none; color: var(--fg); }
.cap.sel { background: var(--sc); color: #140200; border-color: var(--sc); box-shadow: none; }
.cap.sel::before { background: #140200; }

.card { background: #0f0f0f; border: 1px solid #232323; border-radius: 6px; clip-path: none; box-shadow: none; padding: 12px 11px 10px; position: relative; }
.card::after { display: none; }
.card h3 { font: 700 10px var(--f-display); text-transform: uppercase; letter-spacing: .24em; color: var(--mute); margin: 0 0 12px; display: flex; align-items: center; }
.card h3::before { content: ""; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); flex: none; }
.card h3 button.mini { padding: 4px 9px; border-radius: 4px; }

/* knobs: thin value arc, flat matte cap, one red indicator line */
.knob .trk { stroke: #1b1b1b; stroke-width: 4; stroke-linecap: butt; }
.knob .val { stroke-width: 4; stroke-linecap: butt; }
.knob .mod { stroke-linecap: butt; }
.knob .cap { fill: #161616; stroke: #343434; stroke-width: 1; }
.knob .ind { stroke: var(--accent); stroke-width: 2.6; stroke-linecap: butt; }
.knob .lbl { font-family: var(--f-display); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; color: var(--mute); }
.knob .vv { color: var(--fg); }
.knob.armed svg { filter: drop-shadow(0 0 6px var(--arm)); }

/* ================= living interface: live beads, cable, ignition ================= */
.knob .liv { fill: #fff; stroke: var(--kc, var(--accent)); stroke-width: 1.6; filter: drop-shadow(0 0 4px var(--kc, var(--accent))); pointer-events: none; }
.knob .cap { transition: stroke .35s ease; }
.knob .val { filter: drop-shadow(0 0 0 transparent); transition: filter .35s ease; }
.knob .vv { text-shadow: 0 0 0 transparent; transition: color .35s ease, text-shadow .35s ease; }
.knob.touch .cap { stroke: color-mix(in srgb, var(--accent) 70%, #fff 20%); }
.knob.touch .val { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--kc, var(--accent)) 90%, transparent)); }
.knob.touch .vv { color: var(--accent-fg); text-shadow: 0 0 8px var(--accent-glow); }
.knob.zap svg { animation: zap .6s ease-out; }
.knob.zap .mod { animation: modin .6s ease-out; }
@keyframes zap { 0% { transform: scale(1); } 25% { transform: scale(1.17); filter: drop-shadow(0 0 14px var(--arm, var(--accent))); } 100% { transform: scale(1); } }
@keyframes modin { 0% { stroke-width: 10; opacity: 0; } 40% { stroke-width: 7; opacity: 1; } 100% { stroke-width: 3; opacity: .95; } }
.cap { position: relative; }
.cap::before { opacity: calc(.5 + var(--lv, 0) * .5); box-shadow: 0 0 calc(var(--lv, 0) * 12px) var(--sc); }
.cap::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--sc); transform-origin: left center; transform: scaleX(var(--lv, 0)); box-shadow: 0 0 6px var(--sc); pointer-events: none; }
#cable { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 89; pointer-events: none; display: none; overflow: visible; }
#cable.show { display: block; }
#cable path { fill: none; stroke: var(--sc, var(--accent)); stroke-linecap: round; }
#cable .glow { stroke-width: 10; opacity: .22; filter: blur(3px); }
#cable .core { stroke-width: 2.6; stroke-dasharray: 8 6; animation: cflow .6s linear infinite; }
#cable .end, #cable .start { fill: var(--sc, var(--accent)); filter: drop-shadow(0 0 6px var(--sc, var(--accent))); }
#cable.plug { animation: unplug .38s ease-in forwards; }
#cable.plug .core { animation: none; stroke-dasharray: none; }
@keyframes cflow { to { stroke-dashoffset: -28; } }
@keyframes unplug { to { opacity: 0; } }
.chip, .pill, .btn, .snap, .pnav, .hbtn, #presetBtn, .pi, .cap { transition: box-shadow .22s ease, color .18s ease, border-color .18s ease, transform .09s ease; }
.sw::after { transition: transform .2s cubic-bezier(.3,1.4,.5,1), background .2s, box-shadow .25s; }
.sw { transition: box-shadow .25s ease, border-color .2s; }
@keyframes ignite { 0% { box-shadow: 0 0 0 transparent, inset 0 0 0 transparent; } 30% { box-shadow: 0 0 26px var(--accent-glow), inset 0 0 10px var(--accent-glow); } }
.pill.on, .chip.on, .snap.on, .mini.on, .pi.cur { animation: ignite .5s ease-out; }
.sw.on { animation: ignite .5s ease-out; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
